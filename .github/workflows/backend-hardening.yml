name: Backend Hardening

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

env:
  SHADOWLAB_SECRET_KEY: ci-shadowlab-secret-key-with-32-bytes-of-entropy
  SHADOWLAB_REQUIRE_AUTH: "false"
  SHADOWLAB_POLICY_PROFILE: lab
  SHADOWLAB_NOAUTH_DEFAULT_ROLE: admin
  SHADOWLAB_DATABASE_URL: sqlite:///./ci_shadowlab.db
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Verify backend suite
        run: python scripts/ci_verify.py

      - name: Build dependency SBOM
        run: |
          mkdir -p ci_artifacts
          cyclonedx-py requirements -i requirements.txt -o ci_artifacts/shadowlab-sbom.json

      - name: Build CI evidence bundle
        if: github.event_name == 'push'
        run: |
          mkdir -p ci_artifacts
          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci_artifacts/verify-evidence.txt

      - name: Upload CI evidence artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: ci_artifacts/verify-evidence.txt
          if-no-files-found: error

      - name: Upload SBOM artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: shadowlab-sbom
          path: ci_artifacts/shadowlab-sbom.json
          if-no-files-found: error

      - name: Attest CI evidence artifact
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ci_artifacts/verify-evidence.txt

      - name: Attest SBOM artifact
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ci_artifacts/shadowlab-sbom.json

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shadowlab
          POSTGRES_USER: shadowlab
          POSTGRES_PASSWORD: shadowlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowlab -d shadowlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test PostgreSQL runtime
        env:
          SHADOWLAB_DATABASE_URL: postgresql://shadowlab:shadowlab@127.0.0.1:5432/shadowlab
        run: |
          python scripts/smoke_test_postgres_runtime.py
          python scripts/validate_enterprise_postgres_readiness.py
