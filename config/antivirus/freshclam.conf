# freshclam configuration for the ShadowLab Sentinel (ClamAV) provider.
#
# The two path lines below are placeholders the bootstrap script rewrites
# at first run so the absolute paths match THIS install's `shadowlab_out`.
# If you are running freshclam manually, replace `__SHADOWLAB_ROOT__`
# with the absolute path to your repo root (the folder that contains
# `app.py`).
DatabaseDirectory "__SHADOWLAB_ROOT__\shadowlab_out\antivirus\sentinel\database"
UpdateLogFile "__SHADOWLAB_ROOT__\shadowlab_out\antivirus\sentinel\freshclam.log"
LogTime yes
LogVerbose yes
DatabaseMirror database.clamav.net
