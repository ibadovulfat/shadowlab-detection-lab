dist:
  name: shadowlab-telemetry-fabric
  description: ShadowLab telemetry fabric distribution built from the upstream collector source tree.
  module: github.com/shadowlab/telemetry-fabric
  # Output path is relative to the repo root so this YAML stays portable.
  # The ShadowLab bootstrap rewrites it to an absolute path at build time
  # when an explicit override is needed.
  output_path: ./build/telemetry-fabric

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.147.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.147.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.147.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.147.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.147.0
