# Monitoring settings
duration: 90
interval: 1.0

# VirusTotal Settings
virustotal_api_key: ""


# Event IDs to monitor
defender_ids:
    1006: "Malware detected (scan)"
    1116: "Malware detected (on-access)"
    1117: "Remediation action taken"
    1118: "Remediation failed"
    5007: "Configuration changed"

sysmon_ids:
    1:  "Process creation"
    2:  "File creation time changed"
    3:  "Network connection"
    7:  "Image loaded"
    8:  "CreateRemoteThread"
    11: "File create"
    12: "Registry add"
    13: "Registry set"
    22: "DNS query"

telemetry_fabric:
    enabled: true
    export_on_monitor: true
    service_name: "shadowlab"
    service_namespace: "shadowlab"
    service_version: "2.1.0"
    environment: "lab"
    otlp_http_endpoint: "http://127.0.0.1:4318"
    timeout_seconds: 5
    headers: {}
    runtime:
        enabled: true
        binary_path: "build\\telemetry-fabric\\shadowlab-telemetry-fabric.exe"
        config_path: "config\\telemetry-fabric-runtime.yaml"
        zpages_url: "http://127.0.0.1:55679/debug/servicez"
    build:
        manifest_path: "config\\telemetry-fabric-builder.yaml"
